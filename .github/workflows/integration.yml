# Integration tests: the dockerized end-to-end suite (tests/integration/).
#
# Builds THIS tree's packages with the OpenWrt SDK — one x86-64 build per
# package manager (apk on 25.12, ipk on 22.03) — and runs the harness
# against them for both variants: the real install.sh inside a dockerized
# OpenWrt router, the router configured with its own tools (uci,
# /etc/init.d/*), connected to a real TrustTunnel endpoint container, with
# the tunnel traffic verified end to end (through-tunnel requests arrive
# with the endpoint's source address, private traffic stays direct, the
# blackhole killswitch swallows marked traffic, and
# install/uci-defaults/reload are idempotent).
#
# Separate from ci.yml on purpose: the SDK builds are the slow part, and
# the fast contract gates must not wait for them. The release workflow
# stays the single publisher; this workflow only builds and tests.

name: integration

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

# A per-ref group: a new push to the same branch supersedes the previous
# run instead of stacking expensive builds.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-repo:
    name: Build the packages for the integration test (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One failed build must not cancel the other: both repositories are
      # needed for the integration job.
      fail-fast: false
      matrix:
        include:
          - version: 22.03.7
            ext: ipk
          - version: 25.12.5
            ext: apk
    steps:
      # luci.mk's findrev derives the package version from the git
      # history, so .git must ride along into the SDK feed.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Release SDKs for determinism (the snapshot container pins a
      # moving packages-feed commit; release.yml documents the curl
      # Kconfig failure that causes). One x86-64 build covers the lab
      # router. The recipe is tests/integration/build-sdk.sh — the same
      # one the harness runs locally: the gh-action-sdk's package
      # selection is driven by the generated .config, which in CI
      # sometimes does not select the i18n companion (its packaging is a
      # side product of the app's compile), so the translation package
      # is compiled EXPLICITLY here and cannot be skipped.
      - name: Build the packages with the SDK
        run: sh tests/integration/build-sdk.sh ${{ matrix.version }}

      # The recipe collects the packages into dist/ already; only the
      # presence is asserted here so a missing package fails the job
      # loudly instead of surfacing as a confusing harness failure.
      - name: Assert the built packages
        run: |
          for p in luci-app-trusttunnel luci-i18n-trusttunnel- trusttunnel-client; do
            if [ -z "$(find dist -name "$p*.${{ matrix.ext }}" -print -quit)" ]; then
              echo "::error::no $p package was built"
              exit 1
            fi
          done
          echo "packages:"
          find dist -name "*.${{ matrix.ext }}" | sort

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.version }}
          path: dist/*

  integration:
    name: Integration test (${{ matrix.pm }})
    needs: build-repo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One variant's failure must not cancel the other: both results are
      # needed to tell a package-manager regression from a generic one.
      fail-fast: false
      matrix:
        pm: [apk, opkg]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The client creates its tun device inside the router container,
      # which needs the host's /dev/net/tun. The runners usually have it;
      # the mknod/modprobe fallback covers the rest, and a clear failure
      # beats a confusing one deep inside the harness.
      - name: Preflight /dev/net/tun
        run: |
          if [ ! -e /dev/net/tun ]; then
            sudo mknod -m 666 /dev/net/tun c 10 200 || true
            sudo modprobe tun || true
          fi
          test -e /dev/net/tun || {
            echo "::error::/dev/net/tun is not available (load the tun module)"
            exit 1
          }
          echo "/dev/net/tun is available"

      # Both matrix artifacts are merged into one directory; the harness
      # selects the packages of its package manager by file-name globs.
      - name: Download the built repositories
        uses: actions/download-artifact@v7
        with:
          pattern: repo-*
          path: repos
          merge-multiple: true

      # The harness itself is docker-gated with a SKIP (exit 77) for
      # local machines without docker; on CI docker is guaranteed by the
      # preflight above, so a skip here would be a bug — the step fails
      # on it.
      - name: Run the harness
        run: |
          TT_PM=${{ matrix.pm }} \
          TT_REPO_DIR="$PWD/repos" \
          TT_LOGS_DIR="$PWD/logs" \
            sh tests/integration/run.sh

      # On failure the harness collects the router state (logread, client
      # log, routing status, kernel state, configs) and the container
      # logs into $TT_LOGS_DIR — upload them for the PR review.
      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs-${{ matrix.pm }}
          path: logs/
          if-no-files-found: ignore
