# Release pipeline: builds the TrustTunnel packages and publishes the
# package repositories the installer configures on routers.
#
# A tag push (v*) or a manual workflow_dispatch run produces:
#   - the noarch LuCI packages and the per-architecture client builds,
#   - per-architecture signed repositories in the official OpenWrt layout
#     (releases/<version>/packages/<arch>/trusttunnel/ on the site: the
#     apk tree 25.12.5 serves OpenWrt 25.12+, the opkg tree 22.03.7
#     serves 22.03-24.10, one signed feed directory per architecture),
#     each verified by installing into fresh rootfs containers,
#   - an end-to-end integration verification of the release's own x86-64
#     packages (the dockerized suite from tests/integration/) that the
#     publish step waits for,
#   - a GitHub release carrying the package files (tag pushes only), and
#   - the GitHub Pages site that serves the repositories (the URL the
#     installer writes into the router's package-manager configuration).
#
# The repositories are cumulative: the packages of every prior release
# are merged into the fresh build's repositories, so every released
# version stays installable — pinning and downgrading keep working.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # contents: create the GitHub release with the package files. pages and
  # id-token: deploy the repository site to GitHub Pages — Pages demands
  # the OIDC token to prove the deployment's provenance (without it the
  # deploy step fails with 403).
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build luci-app-trusttunnel (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      # One failed build must not cancel the other: every artifact is
      # needed for the repositories.
      fail-fast: false
      matrix:
        include:
          - version: 25.12.5
            ext: apk
          - version: 22.03.7
            ext: ipk
    steps:
      - name: Check out the feed
        uses: actions/checkout@v7

      # The SDK action mounts the whole repository (the feed) and the
      # artifacts directory into its container and chowns both paths
      # before starting it; the directory must already exist.
      - name: Prepare the artifacts directory
        run: mkdir -p out

      # The action's entrypoint clones every feed in the SDK's
      # feeds.conf.default by default. Only three of the six feeds are
      # needed here (base: the SDK's own package tree, packages: curl,
      # luci: luci.mk); routing/telephony/video are cloned but used by
      # nothing in this project. NO_DEFAULT_FEEDS drops the defaults and
      # EXTRA_FEEDS replaces them. The feed pins are the other half of
      # the SDK pin: when the SDK version is bumped, update them in
      # tests/integration/restricted-feeds.sh together with VERSION_PATH.
      #
      # The verification runs first: a stale pin would silently build
      # against different feed commits than the SDK pins, and the
      # repository install checks below would not catch it. The pin
      # check pulls the openwrt/sdk image (the release tarball's
      # feeds.conf.default is byte-identical); the integration workflow
      # runs the same check on every PR at no extra cost.
      - name: Verify the restricted feed pins match the SDK
        run: sh tests/integration/restricted-feeds.sh --verify ${{ matrix.version }}

      - name: Restrict the SDK feeds
        run: |
          feeds="$(sh tests/integration/restricted-feeds.sh ${{ matrix.version }})"
          printf 'EXTRA_FEEDS=%s\n' "$feeds" >> "$GITHUB_ENV"

      - name: Build the packages with the SDK
        uses: openwrt/gh-action-sdk@v7
        env:
          # The package is noarch, so one x86-64 SDK build serves every
          # device architecture.
          #
          # VERSION_PATH pins the SDK source to the release tarball
          # instead of the ghcr snapshot container's default (snapshots):
          # the snapshot SDK pins a moving packages-feed commit, and the
          # curl package at some of those commits carries a Kconfig
          # recursive dependency (PACKAGE_libcurl <-> LIBCURL_LDAP) that
          # breaks the config generation as soon as the +curl dependency
          # enables libcurl. The release pins are stable and validated.
          VERSION_PATH: releases/25.12.5
          ARCH: x86-64-${{ matrix.version }}
          FEEDNAME: ttowrt
          # Replaces the default feeds with the restricted set from the
          # step above (see its comment).
          NO_DEFAULT_FEEDS: "1"
          # Absolute on purpose: docker reads a relative value as a volume
          # NAME and the feed would come up empty. The .git directory must
          # be inside the feed for luci.mk's findrev to derive the package
          # version from the repository.
          FEED_DIR: ${{ github.workspace }}
          # Kept separate from the feed so the action's bin/ move cannot
          # dump foreign packages into the repository tree.
          ARTIFACTS_DIR: ${{ github.workspace }}/out
          PACKAGES: luci-app-trusttunnel

      - name: Collect the built packages
        run: |
          mkdir -p dist
          find out/bin/ -name "luci-app-trusttunnel*.${{ matrix.ext }}" -exec cp {} dist/ \;
          if [ -z "$(find dist -name "luci-app-trusttunnel*.${{ matrix.ext }}" -print -quit)" ]; then
            echo "::error::no luci-app-trusttunnel package was built"
            exit 1
          fi

      # The Makefile derives the version from the git tag, so on a tag
      # push the built file name must match the tag exactly — the tag is
      # the single source of truth for what a release carries (a version
      # whose packages did not match their tag shipped unusable releases
      # in the past). Dispatch runs build whatever HEAD is checked out, so
      # the assertion is skipped there.
      - name: Assert the package file name matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXT: ${{ matrix.ext }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$EXT" = apk ]; then
            expected="dist/luci-app-trusttunnel-${tag}-r1.apk"
          else
            expected="dist/luci-app-trusttunnel_${tag}_all.ipk"
          fi
          if [ ! -f "$expected" ]; then
            echo "::error::the built package does not match the tag: expected $expected"
            exit 1
          fi

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.version }}
          path: dist/*

      - name: Upload the build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.version }}
          path: out/logs/
          # Some failure modes never create logs; the job must not fail
          # again while reporting itself.
          if-no-files-found: ignore

  # The client ships one binary per device architecture: the Makefile
  # selects the vendor build (armv7l/armv8l/mips/...) from the target
  # arch, so every OpenWrt target string in the matrix must be built
  # explicitly. apk matches the package arch against the device's own
  # arch byte-exactly, and opkg does the same for the feed it installs
  # from — hence one signed feed directory per arch
  # (releases/<version>/packages/<arch>/trusttunnel/ on the site). The
  # ipk row list is the apk list minus aarch64_cortex-a76 (that target
  # only exists on 25.12-era SDKs).
  # Every row first checks whether the same version is already published
  # on the site and only runs the SDK build for missing packages: the
  # client version comes from the Makefile, not the release tag, so a
  # LuCI-only release must not repackage the unchanged client.
  build-client:
    name: Build trusttunnel-client (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      # One failed arch must not cancel the rest: every build is needed
      # for its repository directory.
      fail-fast: false
      matrix:
        include:
          - version: 25.12.5
            ext: apk
            arch: x86_64
          - version: 25.12.5
            ext: apk
            arch: aarch64_generic
          - version: 25.12.5
            ext: apk
            arch: aarch64_cortex-a53
          - version: 25.12.5
            ext: apk
            arch: aarch64_cortex-a72
          - version: 25.12.5
            ext: apk
            arch: aarch64_cortex-a76
          - version: 25.12.5
            ext: apk
            arch: arm_cortex-a5_vfpv4
          - version: 25.12.5
            ext: apk
            arch: arm_cortex-a7
          - version: 25.12.5
            ext: apk
            arch: arm_cortex-a7_neon-vfpv4
          - version: 25.12.5
            ext: apk
            arch: arm_cortex-a7_vfpv4
          - version: 25.12.5
            ext: apk
            arch: arm_cortex-a8_vfpv3
          - version: 25.12.5
            ext: apk
            arch: arm_cortex-a9
          - version: 25.12.5
            ext: apk
            arch: arm_cortex-a9_neon
          - version: 25.12.5
            ext: apk
            arch: arm_cortex-a9_vfpv3-d16
          - version: 25.12.5
            ext: apk
            arch: arm_cortex-a15_neon-vfpv4
          - version: 25.12.5
            ext: apk
            arch: mips_24kc
          - version: 25.12.5
            ext: apk
            arch: mips_mips32
          - version: 25.12.5
            ext: apk
            arch: mipsel_24kc
          - version: 25.12.5
            ext: apk
            arch: mipsel_24kc_24kf
          - version: 25.12.5
            ext: apk
            arch: mipsel_74kc
          - version: 25.12.5
            ext: apk
            arch: mipsel_mips32
          - version: 22.03.7
            ext: ipk
            arch: x86_64
          - version: 22.03.7
            ext: ipk
            arch: aarch64_generic
          - version: 22.03.7
            ext: ipk
            arch: aarch64_cortex-a53
          - version: 22.03.7
            ext: ipk
            arch: aarch64_cortex-a72
          - version: 22.03.7
            ext: ipk
            arch: arm_cortex-a5_vfpv4
          - version: 22.03.7
            ext: ipk
            arch: arm_cortex-a7
          - version: 22.03.7
            ext: ipk
            arch: arm_cortex-a7_neon-vfpv4
          - version: 22.03.7
            ext: ipk
            arch: arm_cortex-a7_vfpv4
          - version: 22.03.7
            ext: ipk
            arch: arm_cortex-a8_vfpv3
          - version: 22.03.7
            ext: ipk
            arch: arm_cortex-a9
          - version: 22.03.7
            ext: ipk
            arch: arm_cortex-a9_neon
          - version: 22.03.7
            ext: ipk
            arch: arm_cortex-a9_vfpv3-d16
          - version: 22.03.7
            ext: ipk
            arch: arm_cortex-a15_neon-vfpv4
          - version: 22.03.7
            ext: ipk
            arch: mips_24kc
          - version: 22.03.7
            ext: ipk
            arch: mips_mips32
          - version: 22.03.7
            ext: ipk
            arch: mipsel_24kc
          - version: 22.03.7
            ext: ipk
            arch: mipsel_24kc_24kf
          - version: 22.03.7
            ext: ipk
            arch: mipsel_74kc
          - version: 22.03.7
            ext: ipk
            arch: mipsel_mips32
    steps:
      - name: Check out the feed
        uses: actions/checkout@v7

      # Same reason as the build job: the SDK action chowns the mount
      # paths before starting its container, so the artifacts directory
      # must exist already.
      - name: Prepare the artifacts directory
        run: mkdir -p out

      # Skip the SDK build when the same package is already published:
      # rebuilding would only reproduce the identical binaries. The client
      # version comes from the Makefile, NOT from the release tag — a
      # LuCI-only release must not repackage the unchanged client. The
      # version is read from PKG_VERSION/PKG_RELEASE; the apk and ipk file
      # names join them differently (apk: -r<release>, opkg: -<release>).
      # The published package is fetched from the GitHub Pages site — the
      # very files the routers install from. A copy of the client Makefile
      # is carried in the repositories alongside the packages, so a recipe
      # change without a version bump also forces a rebuild instead of
      # silently reusing a stale artifact. Anything missing (new version,
      # new arch, first publish, recipe drift) falls through to the SDK
      # build below. NOTE: the SDK pins in this workflow are the other
      # half of the recipe — when they change, bump PKG_RELEASE so the
      # reuse check rebuilds.
      - name: Reuse the published client package when the version is unchanged
        id: reuse
        run: |
          version="$(sed -n 's/^PKG_VERSION:=//p' packages/trusttunnel-client/Makefile)"
          release="$(sed -n 's/^PKG_RELEASE:=//p' packages/trusttunnel-client/Makefile)"
          if [ -z "$version" ] || [ -z "$release" ]; then
            echo "::error::cannot read PKG_VERSION/PKG_RELEASE from packages/trusttunnel-client/Makefile"
            exit 1
          fi
          if [ "${{ matrix.ext }}" = apk ]; then
            pkg="trusttunnel-client-${version}-r${release}.apk"
          else
            pkg="trusttunnel-client_${version}-${release}_${{ matrix.arch }}.ipk"
          fi
          # Both package types live in their release tree — apk in
          # releases/25.12.5/, ipk in releases/22.03.7/ (the matrix
          # version IS the tree segment; the official
          # releases/<version>/packages/<arch>/<feed>/ layout).
          url="https://i-zhirov.github.io/trusttunnel-openwrt/releases/${{ matrix.version }}/packages/${{ matrix.arch }}/trusttunnel/${pkg}"
          mkdir -p dist
          tmp="$(mktemp)"
          if ! curl -fsSL -o "$tmp" "$url" 2>/dev/null; then
            rm -f "$tmp"
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No published ${pkg} for ${{ matrix.arch }}; building it."
            exit 0
          fi
          # The published artifact is reusable only when the recipe that
          # produced it matches the current Makefile. The recipe copy
          # lives at the release-tree root (one per tree, shared by every
          # architecture — not inside the feed directories).
          mkurl="https://i-zhirov.github.io/trusttunnel-openwrt/releases/${{ matrix.version }}/trusttunnel-client.Makefile"
          tmpmk="$(mktemp)"
          if curl -fsSL -o "$tmpmk" "$mkurl" 2>/dev/null \
            && diff -q "$tmpmk" packages/trusttunnel-client/Makefile >/dev/null; then
            if [ "${{ matrix.ext }}" = apk ]; then
              # The repository stores the apk without the arch suffix; the
              # -<arch> marker is added back for the release assets, and
              # the ARCH-* marker lets the repository assembly discover
              # the built architectures.
              mv "$tmp" "dist/${pkg%.apk}-${{ matrix.arch }}.apk"
              printf '%s\n' "${{ matrix.arch }}" > "dist/ARCH-${{ matrix.arch }}"
            else
              mv "$tmp" "dist/${pkg}"
            fi
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Reusing the published ${pkg} for ${{ matrix.arch }}"
          else
            rm -f "$tmp"
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The published ${pkg} for ${{ matrix.arch }} was built from a different recipe; rebuilding."
          fi
          rm -f "$tmpmk"

      # trusttunnel-client needs only the base feed (its kmod-tun and
      # ca-bundle deps live there; the luci and packages clones would be
      # dead weight on every one of the 37 arch jobs). Same mechanism
      # and pin-maintenance rule as the build job's restriction step.
      - name: Restrict the SDK feeds
        if: steps.reuse.outputs.present != 'true'
        run: |
          feeds="$(sh tests/integration/restricted-feeds.sh ${{ matrix.version }} client)"
          printf 'EXTRA_FEEDS=%s\n' "$feeds" >> "$GITHUB_ENV"

      - name: Build trusttunnel-client with the SDK
        if: steps.reuse.outputs.present != 'true'
        uses: openwrt/gh-action-sdk@v7
        env:
          # Release SDK for the same determinism reason as the build job.
          VERSION_PATH: ${{ matrix.version == '25.12.5' && 'releases/25.12.5' || 'releases/22.03.7' }}
          ARCH: ${{ matrix.arch }}-${{ matrix.version }}
          FEEDNAME: ttowrt
          # Replaces the default feeds with the base-only set from the
          # step above (see its comment).
          NO_DEFAULT_FEEDS: "1"
          FEED_DIR: ${{ github.workspace }}
          ARTIFACTS_DIR: ${{ github.workspace }}/out
          PACKAGES: trusttunnel-client

      - name: Collect the built client package
        if: steps.reuse.outputs.present != 'true'
        run: |
          mkdir -p dist
          if [ "${{ matrix.ext }}" = apk ]; then
            # The SDK output is nested (out/bin/packages/<target>/<feed>/):
            # the find must recurse. The apk file name carries no arch.
            f="$(find out/bin/ -name 'trusttunnel-client*.apk' -print -quit)"
            if [ -z "$f" ]; then
              echo "::error::no trusttunnel-client apk was built for ${{ matrix.arch }}"
              exit 1
            fi
            # apk reconstructs package file names from the metadata, so
            # the arch suffix exists only to keep the 20 uploads apart
            # when they are merged later. The marker lets the repository
            # assembly discover the built architectures.
            cp "$f" "dist/$(basename "$f" .apk)-${{ matrix.arch }}.apk"
            printf '%s\n' "${{ matrix.arch }}" > "dist/ARCH-${{ matrix.arch }}"
          else
            f="$(find out/bin/ -name 'trusttunnel-client*.ipk' -print -quit)"
            if [ -z "$f" ]; then
              echo "::error::no trusttunnel-client ipk was built for ${{ matrix.arch }}"
              exit 1
            fi
            # The ipk name already carries the arch, so a plain copy is
            # enough to keep the merged feed unambiguous.
            cp "$f" dist/
          fi

      # Both paths — the SDK build and the published-package reuse — must
      # leave the expected package in dist/: the upload and the repository
      # assembly consume exactly what this step asserts.
      - name: Assert the client package is present
        run: |
          if [ -z "$(find dist -name 'trusttunnel-client*.${{ matrix.ext }}' -print -quit)" ]; then
            echo "::error::no trusttunnel-client package was produced for ${{ matrix.arch }}"
            exit 1
          fi

      - name: Upload the client package
        uses: actions/upload-artifact@v7
        with:
          name: package-client-${{ matrix.version }}-${{ matrix.arch }}
          path: dist/*

      - name: Upload the build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-client-${{ matrix.version }}-${{ matrix.arch }}
          path: out/logs/
          if-no-files-found: ignore

  # The end-to-end verification: the same dockerized suite the
  # integration workflow runs on PRs, executed against the packages THIS
  # pipeline just built. No SDK rebuild — the release's own x86-64
  # artifacts are consumed directly — and publish-repo waits for the
  # results, so only a behaviorally tested release ships. The packages
  # come from this pipeline's tree on purpose: the harness must test the
  # artifacts being released, not any pre-built ones.
  verify-integration:
    name: Verify the release with the integration tests (${{ matrix.pm }})
    needs: [build, build-client]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One variant's failure must not cancel the other: both results are
      # needed to tell a package-manager regression from a generic one.
      fail-fast: false
      matrix:
        include:
          - pm: apk
            version: 25.12.5
          - pm: opkg
            version: 22.03.7
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The client creates its tun device inside the router container,
      # which needs the host's /dev/net/tun; the mknod/modprobe fallback
      # covers runners without the node, and a clear failure beats a
      # confusing one deep inside the harness.
      - name: Preflight /dev/net/tun
        run: |
          if [ ! -e /dev/net/tun ]; then
            sudo mknod -m 666 /dev/net/tun c 10 200 || true
            sudo modprobe tun || true
          fi
          test -e /dev/net/tun || {
            echo "::error::/dev/net/tun is not available (load the tun module)"
            exit 1
          }
          echo "/dev/net/tun is available"

      # The LuCI app artifact (package-<version>) and the x86_64 client
      # artifact (package-client-<version>-x86_64) land in one directory;
      # the harness selects its package manager's files by name globs.
      - name: Download the LuCI package
        uses: actions/download-artifact@v7
        with:
          name: package-${{ matrix.version }}
          path: repos
          merge-multiple: true

      - name: Download the client package
        uses: actions/download-artifact@v7
        with:
          name: package-client-${{ matrix.version }}-x86_64
          path: repos
          merge-multiple: true

      - name: Run the integration harness
        run: |
          TT_PM=${{ matrix.pm }} \
          TT_REPO_DIR="$PWD/repos" \
          TT_LOGS_DIR="$PWD/logs" \
            sh tests/integration/run.sh

      # On failure the harness collects the router state and the
      # container logs into $TT_LOGS_DIR — upload them for the release
      # review.
      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-integration-logs-${{ matrix.pm }}
          path: logs/
          if-no-files-found: ignore

  # Assembly, signing and publishing. The repositories are served from
  # GitHub Pages, which serves the files byte-identically, as the
  # package managers rely on.
  publish-repo:
    name: Assemble and publish the repositories
    needs: [build, build-client, verify-integration]
    # Tag pushes publish a release; dispatch runs publish the repositories
    # and the site. Plain branch CI runs never publish anything.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Provides the repo-site templates and the committed public halves
      # of the signing keys (key-build.pub, opkg-key.pub).
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download the LuCI packages (apk)
        uses: actions/download-artifact@v7
        with:
          name: package-25.12.5
          path: staging/luci-apk

      - name: Download the LuCI packages (ipk)
        uses: actions/download-artifact@v7
        with:
          name: package-22.03.7
          path: staging/luci-ipk

      - name: Download the client packages (apk)
        uses: actions/download-artifact@v7
        with:
          # One artifact per architecture; merge them into a single tree.
          pattern: package-client-25.12.5-*
          path: staging/apk-pkgs
          merge-multiple: true

      - name: Download the client packages (ipk)
        uses: actions/download-artifact@v7
        with:
          pattern: package-client-22.03.7-*
          path: staging/opkg-pkgs
          merge-multiple: true

      # The GitHub release is a second copy of the repository contents
      # (see the upload step below): every released tag carries exactly
      # the packages that were published to the repositories that day.
      # Pull them all so the repositories keep serving every prior
      # version, not just the newest. gh queries the API, so no local
      # tag history is needed (the checkout is shallow).
      - name: Download the prior release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p staging/prior-apk staging/prior-opkg
          # The release being built is excluded — its freshly built
          # packages are staged by the build jobs. On a dispatch run
          # the ref is a branch name, which matches no release, so
          # every release is kept.
          exclude="$GITHUB_REF_NAME"
          tags="$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName')"
          for tag in $tags; do
            [ "$tag" = "$exclude" ] && continue
            # Only the current package set is merged: the early -lite
            # releases and the dropped i18n packages must not resurface
            # in the repositories. The [0-9] anchor keeps the version
            # directly after the package name (-lite versions start
            # with a letter instead), and releases with no matching
            # assets (the first ipk-less release) are skipped, which
            # gh would otherwise report as an error.
            names="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if printf '%s\n' "$names" | grep -Eq '^(luci-app-trusttunnel|trusttunnel-client)-[0-9].*\.apk$'; then
              gh release download "$tag" \
                --pattern 'luci-app-trusttunnel-*.apk' \
                --pattern 'trusttunnel-client-*.apk' \
                --dir staging/prior-apk --clobber
            fi
            if printf '%s\n' "$names" | grep -Eq '^(luci-app-trusttunnel|trusttunnel-client)_[0-9].*\.ipk$'; then
              gh release download "$tag" \
                --pattern 'luci-app-trusttunnel_*.ipk' \
                --pattern 'trusttunnel-client_*.ipk' \
                --dir staging/prior-opkg --clobber
            fi
          done

      # The repositories are assembled in the official OpenWrt layout:
      # one release tree per package-manager era
      # (releases/25.12.5/ for apk, releases/22.03.7/ for opkg), each
      # holding per-architecture feed directories
      # (releases/<version>/packages/<arch>/trusttunnel/ on the site)
      # with the signed index, the public key and every released version
      # of the packages. apk fetches
      # <url>/releases/25.12.5/packages/<arch>/trusttunnel/packages.adb,
      # opkg appends /Packages.gz to
      # <url>/releases/22.03.7/packages/<arch>/trusttunnel.
      - name: Assemble and sign the apk repositories
        env:
          SIGN_KEY: ${{ secrets.TT_APK_SIGN_KEY }}
        run: |
          mkdir -p staging/releases/25.12.5/packages
          printf '%s\n' "$SIGN_KEY" > key-build.sec

          # Prior releases first, so the freshly built packages win on a
          # same-name collision (a dispatch run at the latest tag). The
          # arch comes from the -<arch> marker the build appended to the
          # asset name. The asset name is
          # trusttunnel-client-<ver>-r<rev>-<arch>.apk: the vendor
          # version is dotted digits (no dashes) and the revision is
          # -r<digits>, so the arch is everything after the second
          # dash-segment — the final dash segment is NOT enough (archs
          # like aarch64_cortex-a53 contain dashes themselves). Arch
          # dirs that the current matrix no longer builds are created,
          # so a dropped architecture keeps its prior packages.
          #
          # Only the client version the current build ships may come
          # from prior releases: the package managers install the
          # highest version, so an old client (the vendor's 1.1.5
          # segfaults on IPv4-only routers; the current build pins
          # 1.0.49) must never shadow the fresh build. Prior files of
          # the same version are duplicates the current placement
          # overwrites anyway — they matter only for dropped arches.
          # The version-revision tail is the first two dash-segments
          # (<ver> is dotted digits, <rev> is r<digits>); the final
          # dash segment is NOT enough, the arch may contain dashes.
          cur_client="$(find staging/apk-pkgs -maxdepth 1 -name "trusttunnel-client-*.apk" -print -quit)"
          cur_client="${cur_client##*/}"
          cur_client="${cur_client#trusttunnel-client-}"
          cur_ver="${cur_client%%-*}"
          cur_rev="${cur_client#*-}"
          cur_rev="${cur_rev%%-*}"
          cur_client="${cur_ver}-${cur_rev}"
          for f in staging/prior-apk/trusttunnel-client-[0-9]*.apk; do
            [ -e "$f" ] || continue
            rest="${f##*/}"
            rest="${rest#trusttunnel-client-}"
            ver="${rest%%-*}"
            rev="${rest#*-}"
            rev="${rev%%-*}"
            verrev="${ver}-${rev}"
            if [ "$verrev" != "$cur_client" ]; then
              echo "skipping prior client $verrev (the current build ships $cur_client)"
              continue
            fi
            rest="${rest#*-}"   # drop <ver>
            arch="${rest#*-}"   # drop -r<rev>
            arch="${arch%.apk}"
            case "$arch" in
              x86_64|aarch64_*|arm_*|mips*)
                mkdir -p "staging/releases/25.12.5/packages/$arch/trusttunnel"
                # Same rename as the current-run placement below: apk
                # reconstructs file names from the package metadata, so
                # the -<arch> suffix is stripped.
                cp "$f" "staging/releases/25.12.5/packages/$arch/trusttunnel/$(basename "$f" "-${arch}.apk").apk" ;;
              *) echo "warning: skipping prior apk with unexpected name: $(basename "$f")" ;;
            esac
          done

          # The built architectures are discovered from the ARCH-*
          # markers written by build-client — the matrix lives in the
          # artifacts, not in a second copy in this job.
          for m in staging/apk-pkgs/ARCH-*; do
            [ -e "$m" ] || { echo "::error::no client artifacts for any architecture"; exit 1; }
            arch="${m#staging/apk-pkgs/ARCH-}"
            mkdir -p "staging/releases/25.12.5/packages/$arch/trusttunnel"
            client="$(find staging/apk-pkgs -maxdepth 1 -name "trusttunnel-client-*-${arch}.apk" -print -quit)"
            if [ -z "$client" ]; then
              echo "::error::no client apk was built for $arch"
              exit 1
            fi
            # apk reconstructs file names from the package metadata, so
            # the -<arch> suffix is stripped on placement.
            cp "$client" "staging/releases/25.12.5/packages/$arch/trusttunnel/$(basename "$client" "-${arch}.apk").apk"
            # The public key sits next to the index it verifies; the
            # installer fetches it from the feed directory.
            cp key-build.pub "staging/releases/25.12.5/packages/$arch/trusttunnel/key-build.pub"
          done

          # The package recipe travels with the release tree — one copy
          # per tree, not per architecture (the client Makefile is shared
          # by every arch): the next release's reuse check diffs it
          # against the current Makefile before skipping a rebuild.
          cp packages/trusttunnel-client/Makefile staging/releases/25.12.5/trusttunnel-client.Makefile

          # The noarch LuCI app lands in every architecture directory —
          # current and prior versions alike, so the whole version
          # history is installable everywhere. Prior first: the fresh
          # build wins on a same-version collision.
          for d in staging/releases/25.12.5/packages/*/trusttunnel/; do
            for f in staging/prior-apk/luci-app-trusttunnel-[0-9]*.apk; do
              [ -e "$f" ] && cp "$f" "$d/"
            done
            cp staging/luci-apk/*.apk "$d/"
          done

          # The packages are built unsigned; only the index is signed, so
          # both mkndx and adbsign must tolerate unsigned packages. The
          # feed directories are three levels deep
          # (releases/<version>/packages/<arch>/<feed>/) — the same
          # layout the official repositories use.
          cat > index-apk.sh <<'EOF'
          #!/bin/sh
          for d in /repo/*/*/; do
            (cd "$d" && apk mkndx --output packages.adb --allow-untrusted *.apk && apk adbsign --allow-untrusted --sign-key /key-build.sec packages.adb) || exit 1
          done
          EOF
          chmod +x index-apk.sh
          docker run --rm \
            -v "$PWD/staging/releases/25.12.5/packages:/repo" \
            -v "$PWD/key-build.sec:/key-build.sec" \
            -v "$PWD/index-apk.sh:/index-apk.sh:ro" \
            alpine:edge@sha256:266f29255458134745f2bf588cb23ed1ed1768b96ff2580a05d70a8aba59e145 \
            sh /index-apk.sh

          find staging/releases/25.12.5 -name packages.adb

      # One signed opkg feed per architecture in the 22.03.7 release
      # tree (releases/22.03.7/packages/<arch>/trusttunnel/): opkg
      # matches the package arch against the device's own arch, so a
      # router only ever reads its own feed directory (install.sh builds
      # the feed URL from DISTRIB_ARCH). Prior releases first, so the
      # freshly built packages win on a same-name collision (a dispatch
      # run at the latest tag). The [0-9] anchor keeps the old -lite
      # packages and the dropped i18n packages out of the feed, and the
      # same version filter as the apk step keeps an old client (the
      # vendor's 1.1.5 segfaults on IPv4-only routers) from shadowing the
      # fresh build — opkg installs the highest version.
      - name: Assemble and sign the opkg repositories
        env:
          SIGN_KEY: ${{ secrets.TT_OPKG_SIGN_KEY }}
        run: |
          # The arch/version derivation from the ipk file names lives in
          # tests/integration/ipk-arch.sh, shared with the integration
          # harness's regression stage — the pipeline and its test cannot
          # drift apart. (The arch names contain underscores: splitting
          # at the wrong one clipped mipsel_24kc to "24kc" once and
          # silently produced feed directories no device would fetch.)
          # The loader marker is required: zsh sets $0 to the sourced
          # file's own name, which would otherwise trigger the script's
          # CLI (and its exit) inside this step.
          TT_IPK_ARCH_SOURCED=1
          # shellcheck disable=SC1091
          . tests/integration/ipk-arch.sh
          mkdir -p staging/releases/22.03.7/packages
          cur_client="$(tt_ipk_verrev "$(find staging/opkg-pkgs -maxdepth 1 -name "trusttunnel-client_*.ipk" -print -quit)")"

          # A dir the current matrix no longer builds is created, so a
          # dropped architecture keeps its prior packages.
          for f in staging/prior-opkg/trusttunnel-client_[0-9]*.ipk; do
            [ -e "$f" ] || continue
            verrev="$(tt_ipk_verrev "$f")"
            if [ "$verrev" != "$cur_client" ]; then
              echo "skipping prior client $verrev (the current build ships $cur_client)"
              continue
            fi
            arch="$(tt_ipk_arch "$f")"
            mkdir -p "staging/releases/22.03.7/packages/$arch/trusttunnel"
            cp "$f" "staging/releases/22.03.7/packages/$arch/trusttunnel/"
          done
          for f in staging/opkg-pkgs/trusttunnel-client_*.ipk; do
            [ -e "$f" ] || continue
            arch="$(tt_ipk_arch "$f")"
            mkdir -p "staging/releases/22.03.7/packages/$arch/trusttunnel"
            cp "$f" "staging/releases/22.03.7/packages/$arch/trusttunnel/"
          done
          # The noarch LuCI app lands in every feed directory — current
          # and prior versions alike, so the whole version history is
          # installable everywhere. The feed key travels with every feed:
          # install.sh fetches it from the feed directory.
          for d in staging/releases/22.03.7/packages/*/trusttunnel/; do
            for f in staging/prior-opkg/luci-app-trusttunnel_[0-9]*.ipk; do
              [ -e "$f" ] && cp "$f" "$d/"
            done
            cp staging/luci-ipk/*.ipk "$d/"
            cp opkg-key.pub "$d/"
          done
          # The package recipe travels with the release tree — one copy
          # per tree, not per architecture: the next release's reuse
          # check diffs it against the current Makefile before skipping a
          # rebuild.
          cp packages/trusttunnel-client/Makefile staging/releases/22.03.7/trusttunnel-client.Makefile

          # The canonical index generator, fetched at run time so the
          # pipeline always uses the tooling of the OpenWrt release it
          # packages.
          curl -fsSL -o ipkg-make-index.sh https://raw.githubusercontent.com/openwrt/openwrt/openwrt-22.03/scripts/ipkg-make-index.sh
          # mkhash shim: the generator needs a hashing helper; sha256sum
          # over the second argument is all it uses.
          cat > mkhash.sh <<'EOF'
          #!/bin/sh
          sha256sum "$2" | cut -d" " -f1
          EOF
          chmod +x mkhash.sh
          ws="$PWD"
          for d in staging/releases/22.03.7/packages/*/trusttunnel/; do
            [ -n "$(ls "$d"/*.ipk 2>/dev/null)" ] || continue
            ( cd "$d" && MKHASH="$ws/mkhash.sh" bash "$ws/ipkg-make-index.sh" . > Packages.manifest )
            # The manifest carries per-package metadata fields that opkg
            # does not understand; drop them from the published index.
            grep -vE '^(Maintainer|LicenseFiles|Source|SourceName|Require|SourceDateEpoch)' "$d/Packages.manifest" > "$d/Packages"
            rm -f "$d/Packages.manifest"
            # usign cannot sign SHA-512 messages of two specific sizes
            # (OpenWrt works around the same bug in its package Makefile);
            # padding the index by two empty lines shifts it past the
            # affected sizes.
            size="$(wc -c < "$d/Packages")"
            if [ $(( (64 + size) % 128 )) -eq 110 ] || [ $(( (64 + size) % 128 )) -eq 111 ]; then
              printf '\n\n' >> "$d/Packages"
            fi
            gzip -9nc "$d/Packages" > "$d/Packages.gz"
          done
          printf '%s\n' "$SIGN_KEY" > opkg.sec
          # The signature covers the UNCOMPRESSED Packages: opkg
          # decompresses the index before verifying it.
          docker run --rm \
            -v "$PWD/staging/releases/22.03.7/packages:/repo" \
            -v "$PWD/opkg.sec:/opkg.sec" \
            openwrt/rootfs:x86-64-22.03.7 \
            sh -c 'for d in /repo/*/*/; do [ -n "$(ls "$d"/*.ipk 2>/dev/null)" ] || continue; (cd "$d" && usign -S -s /opkg.sec -m Packages -x Packages.sig) || exit 1; done'
          find staging/releases/22.03.7 -name Packages.sig

      # The verification installs mirror install.sh's repository setup
      # exactly (key placement, repository entry, feed line), so a green
      # run proves the published repositories install with the installer's
      # own arrangement.
      - name: Verify the apk installs on 25.12
        run: |
          cat > verify-apk.sh <<'EOF'
          #!/bin/sh
          set -e
          mkdir -p /var/lock /etc/apk/keys /etc/apk/repositories.d
          cp /repo/x86_64/trusttunnel/key-build.pub /etc/apk/keys/trusttunnel.pub
          # The index file is named explicitly: a bare directory URL would
          # make apk look for an Alpine-style APKINDEX.tar.gz.
          printf '%s\n' 'file:///repo/x86_64/trusttunnel/packages.adb' > /etc/apk/repositories.d/trusttunnel.list
          apk update
          apk add luci-app-trusttunnel
          # Full path: the client is not on PATH. The version output
          # proves the right statically-linked binary landed.
          /opt/trusttunnel_client/trusttunnel_client --version
          EOF
          docker run --rm \
            -v "$PWD/staging/releases/25.12.5/packages:/repo:ro" \
            -v "$PWD/verify-apk.sh:/verify.sh:ro" \
            openwrt/rootfs:x86-64-25.12.0 \
            sh /verify.sh

      # The 22.03.7-built ipk is verified on the newer rootfs versions on
      # purpose: the package declares no versioned dependencies, and
      # rebuilding on those SDKs would prove nothing about the artifact
      # actually shipped.
      - name: Verify the ipk installs on 23.05/24.10
        run: |
          cat > verify-opkg.sh <<'EOF'
          #!/bin/sh
          set -e
          mkdir -p /var/lock /etc/opkg/keys
          cp /repo/x86_64/trusttunnel/opkg-key.pub /etc/opkg/keys/trusttunnel.pub
          # opkg-key matches keys named by their usign fingerprint; the
          # stable name is kept alongside, exactly as install.sh sets up.
          fp="$(usign -F -p /etc/opkg/keys/trusttunnel.pub)"
          cp /etc/opkg/keys/trusttunnel.pub "/etc/opkg/keys/$fp"
          # The feed URL must NOT name the index: opkg appends
          # /Packages.gz itself and verifies Packages.sig against the key.
          printf '%s\n' 'src/gz trusttunnel file:///repo/x86_64/trusttunnel' > /etc/opkg/customfeeds.conf
          opkg update
          opkg install luci-app-trusttunnel
          /opt/trusttunnel_client/trusttunnel_client --version
          EOF
          for img in x86-64-23.05.6 x86-64-24.10.8; do
            docker run --rm \
              -v "$PWD/staging/releases/22.03.7/packages:/repo:ro" \
              -v "$PWD/verify-opkg.sh:/verify.sh:ro" \
              "openwrt/rootfs:$img" \
              sh /verify.sh
          done

      # Uploading from this single job — never from the matrix jobs —
      # makes the release a single writer, and the tag-only condition
      # keeps dispatch runs away from the releases entirely.
      - name: Upload the package files to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            staging/luci-apk/*.apk
            staging/apk-pkgs/trusttunnel-client-*.apk
            staging/luci-ipk/*.ipk
            staging/opkg-pkgs/*.ipk

      # The site is the workflow's direct output: nothing is committed to
      # any branch. The index pages exist because Pages serves no
      # directory listings — the bare URLs would 404 in a browser without
      # them, while the package managers never fetch those URLs (apk
      # fetches <url>/releases/25.12.5/packages/<arch>/trusttunnel/
      # packages.adb, opkg appends /Packages.gz to the feed URL). The
      # levels with content carry it directly: the tree page lists the
      # architectures (linking straight to their feed pages), the feed
      # pages list their files. The two structural levels in between
      # (packages/ and packages/<arch>/) hold only a one-line redirect
      # stub, so browsing stays at three clicks without any URL 404ing.
      - name: Assemble the Pages site
        run: |
          mkdir -p site/releases
          cp -r staging/releases/. site/releases/
          rm -rf staging

          # The favicon keeps the browsers' automatic /favicon.ico
          # request from 404ing; the config points the theme's "Improve
          # this page" link at the real homepage template.
          cp repo-site/favicon.ico site/favicon.ico
          cp repo-site/_config.yml site/_config.yml
          # The layouts all the index templates reference via their front
          # matter — the theme's default minus the "Improve this page"
          # footer, plus the redirect layout for the structural stubs.
          cp -r repo-site/_layouts site/_layouts

          cp repo-site/README.md site/README.md
          # The ref name lands in the tag slot as-is: on a tag push it is
          # the tag, on a branch dispatch it is the branch name.
          sed -i "s/__TAG__/$GITHUB_REF_NAME/g" site/README.md

          # The releases index lists the assembled release trees —
          # generated from the directories themselves, so there is no
          # second copy of the tree list to keep in sync.
          release_list="$(mktemp)"
          for t in site/releases/*/; do
            printf '%s\n' "- [$(basename "$t")]($(basename "$t")/)" >> "$release_list"
          done
          # r swallows the rest of its line: file read and delete must
          # sit on separate lines inside the braces (see the __FILES__
          # substitution below).
          sed "/__RELEASE_LIST__/{
            r $release_list
            d
          }" repo-site/releases-index.md > site/releases/index.md
          rm -f "$release_list"

          arch_list="$(mktemp)"
          files="$(mktemp)"
          for t in site/releases/*/; do
            tree="$(basename "$t")"

            # The tree page lists the assembled architecture directories,
            # each linking STRAIGHT to its feed page (the arch level only
            # holds a redirect stub) — generated from the directories
            # themselves, so there is no second copy of the build-client
            # matrix to keep in sync.
            : > "$arch_list"
            for d in "$t/packages/"*/; do
              arch="$(basename "$d")"
              printf '%s\n' "- [$arch](packages/$arch/trusttunnel/)" >> "$arch_list"
            done
            sed -e "s/__TREE__/$tree/g" -e "/__ARCH_LIST__/{
              r $arch_list
              d
            }" repo-site/release-index.md > "$t/index.md"

            # The structural levels with no content of their own get a
            # one-line redirect: packages/ lands on the tree page (the
            # arch list), packages/<arch>/ on the arch's feed page. A
            # directly visited URL still works, without adding a click to
            # the normal path.
            printf '%s\n' '---' 'layout: redirect' "redirect_to: ../" '---' > "$t/packages/index.md"
            for d in "$t/packages/"*/; do
              printf '%s\n' '---' 'layout: redirect' "redirect_to: trusttunnel/" '---' > "$d/index.md"
            done

            # One index per feed, listing what that directory actually
            # holds: the signed index, the public key and every package,
            # each as a link to the file itself (a bare name would be
            # dead text — Pages serves no directory listings). Generated
            # from the directories themselves, so a released version
            # shows up here without touching a template.
            for d in "$t/packages/"*/; do
              arch="$(basename "$d")"
              for f in "$d"*/; do
                : > "$files"
                for p in "$f"*; do
                  [ -f "$p" ] || continue
                  printf '%s\n' "- [$(basename "$p")]($(basename "$p"))" >> "$files"
                done
                # The r command consumes the rest of its line as the file
                # name: a "; d" after it would be swallowed and the brace
                # would never close. The file read and the delete must sit
                # on separate lines inside the braces.
                sed -e "s/__TREE__/$tree/g" -e "s/__ARCH__/$arch/g" -e "/__FILES__/{
                  r $files
                  d
                }" repo-site/packages-feed-index.md > "$f/index.md"
              done
            done
          done
          rm -f "$arch_list" "$files"

      - name: Render the site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: site

      - name: Configure the Pages deployment
        uses: actions/configure-pages@v5

      - name: Upload the rendered site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Publishes https://i-zhirov.github.io/trusttunnel-openwrt/ from
      # the artifact — no branch is involved.
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
